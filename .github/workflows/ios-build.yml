name: iOS Build (Simulator)

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    name: Build and Archive
    runs-on: macos-latest

    steps:
      - name: Descargar el código fuente
        uses: actions/checkout@v4

      - name: Configurar Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Compilar el proyecto para Simulador
        run: |
          xcodebuild clean build \
            -project "Reto 5 - Centro quejas sugerencias.xcodeproj" \
            -configuration Release \
            -sdk iphonesimulator \
            -arch x86_64 \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Generar empaquetado .zip
        run: |
          cd build/Release-iphonesimulator
          zip -r ../../BuzonSugerencias-Simulador.zip *.app
          
      - name: Guardar Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: BuzonSugerencias-App
          path: BuzonSugerencias-Simulador.zip
