name: iOS Build (IPA sin firmar)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build and Archive
    runs-on: macos-latest

    steps:
      - name: Descargar el código fuente
        uses: actions/checkout@v4

      - name: Configurar Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Archivar proyecto para dispositivo
        run: |
          xcodebuild clean archive \
            -project "Reto 5 - Centro quejas sugerencias.xcodeproj" \
            -scheme "Reto 5 - Centro quejas sugerencias" \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath "$PWD/build/App.xcarchive" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Generar .ipa
        run: |
          mkdir -p Payload
          cp -R build/App.xcarchive/Products/Applications/*.app Payload/
          zip -r BuzonSugerencias.ipa Payload

      - name: Guardar Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: BuzonSugerencias-IPA
          path: BuzonSugerencias.ipa
