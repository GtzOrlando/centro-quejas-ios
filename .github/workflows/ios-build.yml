name: iOS Build (Unsigned)

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    name: Build and Archive
    runs-on: macos-latest

    steps:
      - name: Descargar el código fuente
        uses: actions/checkout@v4

      - name: Configurar Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Compilar el proyecto en modo Release
        run: |
          xcodebuild clean build \
            -project "Reto 5 - Centro quejas sugerencias.xcodeproj" \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Generar empaquetado .ipa
        run: |
          mkdir -p Payload
          mv build/Release-iphoneos/*.app Payload/
          zip -r BuzonSugerencias.ipa Payload

      - name: Guardar Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: BuzonSugerencias-App
          path: BuzonSugerencias.ipa
